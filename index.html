<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="referrer" content="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 風格 AI 助理</title>
    <style>
        :root {
            --bg-color: #f0f4f9;
            --panel-bg: #ffffff;
            --text-main: #1f1f1f;
            --text-secondary: #5e5e5e;
            --user-bubble: #004a77;
            --user-text: #ffffff;
            --ai-bubble: #f0f4f9;
            --ai-text: #1f1f1f;
            --border-color: #e3e3e3;
        }

        body {
            font-family: Google Sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        @media (min-width: 768px) {
            #app-container {
                height: 90vh;
                border-radius: 16px;
                border: 1px solid var(--border-color);
            }
        }

        /* 標題欄 */
        header {
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 對話內容區 */
        #messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-row {
            display: flex;
            gap: 16px;
            max-width: 85%;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user .avatar { background: #004a77; color: white; }
        .ai .avatar { background: #1a73e8; color: white; }

        .bubble {
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .user .bubble {
            background-color: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            background-color: var(--ai-bubble);
            color: var(--ai-text);
            border-bottom-left-radius: 4px;
        }

        .bubble img {
            max-width: 240px;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        /* 底部輸入區 */
        #input-area-wrapper {
            padding: 16px 24px 24px 24px;
            background: var(--panel-bg);
        }

        #input-box {
            background: #f0f4f9;
            border-radius: 28px;
            border: 1px solid transparent;
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        #input-box:focus-within {
            background: #ffffff;
            border-color: #1a73e8;
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
        }

        #preview-container {
            display: none;
            padding: 8px 0;
            position: relative;
            width: fit-content;
        }

        #preview-img {
            max-height: 70px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .remove-img {
            position: absolute;
            top: 2px;
            right: -8px;
            background: rgba(0,0,0,0.6);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            line-height: 18px;
        }

        #input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            max-height: 150px;
            padding: 6px 0;
            line-height: 1.4;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text-main);
        }

        .icon-btn.recording {
            color: #ea4335;
            animation: pulse 1.5s infinite;
        }

        #send-btn {
            background: #1a73e8;
            color: white;
            border-radius: 50%;
        }
        #send-btn:hover {
            background: #1557b0;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            ✨ <span>Gemini 風格 AI 助理</span>
        </header>

        <div id="messages">
            <!-- 歡迎訊息 -->
            <div class="message-row ai">
                <div class="avatar">AI</div>
                <div class="bubble">你好！有咩我可以幫到你？你可以輸入文字、上傳圖片，或者用廣東話語音同我傾偈。</div>
            </div>
        </div>

        <div id="input-area-wrapper">
            <div id="input-box">
                <div id="preview-container">
                    <img id="preview-img" src="" alt="preview">
                    <div class="remove-img" onclick="clearImage()">×</div>
                </div>
                <div id="input-row">
                    <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImage(event)">
                    <button class="icon-btn" onclick="document.getElementById('image-input').click()" title="上傳圖片">📎</button>
                    
                    <textarea id="user-input" rows="1" placeholder="向 Gemini 提問..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
                    
                    <button id="mic-button" class="icon-btn" onclick="toggleVoice()" title="語音輸入">🎙️</button>
                    <button id="send-btn" class="icon-btn" onclick="sendMessage()" title="發送">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://n8n.gcfmarket.com/webhook/system-api";
        let selectedImage = null;
        let isRecording = false;

        // textarea 自動變高
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 圖片壓縮
        function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxW = 1024;
                    const scale = Math.min(maxW / img.width, 1);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    selectedImage = canvas.toDataURL('image/jpeg', 0.8);
                    
                    document.getElementById('preview-img').src = selectedImage;
                    document.getElementById('preview-container').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            selectedImage = null;
            document.getElementById('preview-container').style.display = 'none';
            document.getElementById('image-input').value = '';
        }

        // 發送訊息
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !selectedImage) return;

            appendMessage(text, 'user', selectedImage);
            
            input.value = '';
            input.style.height = 'auto';
            const imgData = selectedImage;
            clearImage();

            appendMessage("思考中...", 'ai', null, true);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, image: imgData })
                });
                const data = await response.json();
                removeLoading();
                appendMessage(data.reply || data.output || "未收到回覆", 'ai');
            } catch (e) {
                removeLoading();
                appendMessage("網絡連線錯誤，請檢查 n8n 狀態。", 'ai');
            }
        }

        function appendMessage(text, sender, img = null, isLoading = false) {
            const messagesDiv = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;
            if (isLoading) row.id = 'loading-row';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerText = sender === 'user' ? '你' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text;

            if (img) {
                const imageEl = document.createElement('img');
                imageEl.src = img;
                bubble.appendChild(imageEl);
            }

            row.appendChild(avatar);
            row.appendChild(bubble);
            messagesDiv.appendChild(row);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeLoading() {
            const el = document.getElementById('loading-row');
            if (el) el.remove();
        }

        // 語音識別
        let recognition;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'zh-HK';
            recognition.onstart = () => { document.getElementById('mic-button').classList.add('recording'); };
            recognition.onend = () => { document.getElementById('mic-button').classList.remove('recording'); };
            recognition.onresult = (e) => {
                document.getElementById('user-input').value = e.results[0][0].transcript;
                autoResize(document.getElementById('user-input'));
                sendMessage();
            };
        }

        function toggleVoice() {
            if (!recognition) return alert("此瀏覽器不支援語音辨識");
            isRecording ? recognition.stop() : recognition.start();
            isRecording = !isRecording;
        }
    </script>
</body>
</html>
